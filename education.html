<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Education | Sagar Pakhrin</title>

    <meta name="description"
          content="Education and academic background of Sagar Pakhrin.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .back {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .subtitle {
            text-align: center;
            color: #aab7c8;
            margin-bottom: 30px;
        }

        .education-list {
            display: grid;
            gap: 18px;
        }

        .education-item {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border-left: 4px solid #38bdf8;
        }

        .education-item h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .education-item p {
            color: #aab7c8;
            margin: 5px 0;
        }

        .year {
            color: #38bdf8 !important;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .card {
                padding: 22px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <a href="index.html" class="back">
        ← Back to Portfolio
    </a>

    <div class="card">

        <h1>Education</h1>

        <p class="subtitle">
            Sagar Pakhrin
        </p>

        <div class="education-list">

            <!-- EDUCATION 1 -->

            <div class="education-item">

                <h2>School Education</h2>

                <p>
                    Shree Buddha Secondary School, Milche, Kavrepalanchok
                </p>

                <p class="year">
                    Year: 2016
                </p>

            </div>


            <!-- EDUCATION 2 -->

            <div class="education-item">

                <h2>Higher Education</h2>

                <p>
                    Sanjiwani Secondary School, Dhulikhel, Kavrepalanchok
                </p>

                <p class="year">
                    Year: 2018
                </p>



</div>
        </div>

    </div>

</div>

</body>

</html>
