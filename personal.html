<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information | Sagar Pakhrin</title>

    <meta name="description"
          content="Personal information of Sagar Pakhrin, Hospitality Professional.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .back {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .subtitle {
            text-align: center;
            color: #aab7c8;
            margin-bottom: 30px;
        }

        .info {
            display: grid;
            gap: 15px;
        }

        .row {
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }

        .label {
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .value {
            color: #f8fafc;
        }

        @media (max-width: 500px) {
            .card {
                padding: 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">← Back to Portfolio</a>

    <div class="card">

        <h1>Personal Information</h1>

        <p class="subtitle">
            Sagar Pakhrin
        </p>

        <div class="info">

            <div class="row">
                <div class="label">Full Name</div>
                <div class="value">Sagar Pakhrin</div>
            </div>

            <div class="row">
                <div class="label">Profession</div>
                <div class="value">Hospitality Professional</div>
            </div>

            <div class="row">
                <div class="label">Nationality</div>
                <div class="value">Nepali</div>
            </div>

            <div class="row">
                <div class="label">Marital Status</div>
                <div class="value">Married</div>
            </div>

            <div class="row">
                <div class="label">Languages</div>
                <div class="value">Nepali, English</div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
